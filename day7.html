    <script type="module">
        // 1. 引入 Firebase 函式庫 (從 Google CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
        // 2. 貼上你的 Firebase 設定 (請替換這裡！)
        const firebaseConfig = {
        apiKey: "AIzaSyA866R1dunG70pNX91BhvIVortnlB5QuHU",
        authDomain: "fukuoka-busan-trip.firebaseapp.com",
        projectId: "fukuoka-busan-trip",
        storageBucket: "fukuoka-busan-trip.firebasestorage.app",
        messagingSenderId: "130540342304",
        appId: "1:130540342304:web:f4a3f225ab3f2b37f00045",
        measurementId: "G-XDV9S0066R"
        };

    
        // 3. 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const CURRENT_DAY = 'day7'; // 設定這是哪一天的頁面
        
        // 用來存放下載下來的資料
        let scheduleData = [];

        // ==========================================
        // 智慧天氣功能 (單城市 - 釜山)
        // ==========================================
        
        // ⚠️ 請依照不同分頁修改這裡的日期！
        const TARGET_DATE = '2026-03-02'; // Day 6=01, Day 7=02, Day 8=03, Day 9=04

        // 釜山座標
        const CITY_GEO = { lat: 35.10, lon: 129.04 };

        // 歷史備份資料 (依日期對照)
        const HISTORY_DATA = {
            '2026-03-01': { high: 11, low: 3, rain: 10, code: 2 },  // Day 6
            '2026-03-02': { high: 9, low: 1, rain: 20, code: 3 },   // Day 7
            '2026-03-03': { high: 8, low: 2, rain: 70, code: 63 },  // Day 8
            '2026-03-04': { high: 11, low: 3, rain: 10, code: 0 }   // Day 9
        };

        async function fetchWeather() {
            const tripDate = new Date(TARGET_DATE);
            const today = new Date();
            const diffDays = (tripDate - today) / (1000 * 60 * 60 * 24);

            if (diffDays <= 14 && diffDays >= -1) {
                console.log(`Day Page: Fetching live weather for ${TARGET_DATE}`);
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${CITY_GEO.lat}&longitude=${CITY_GEO.lon}&start_date=${TARGET_DATE}&end_date=${TARGET_DATE}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if(data.daily) {
                        updateWeatherUI({
                            high: Math.round(data.daily.temperature_2m_max[0]),
                            low: Math.round(data.daily.temperature_2m_min[0]),
                            rain: data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max[0] : 0,
                            code: data.daily.weathercode[0]
                        });
                        return;
                    }
                } catch(e) { console.error("API Error, using history", e); }
            }

            console.log(`Day Page: Using history data for ${TARGET_DATE}`);
            const history = HISTORY_DATA[TARGET_DATE] || { high: '--', low: '--', rain: 0, code: 0 };
            updateWeatherUI(history);
        }

        function updateWeatherUI(data) {
            const tempContainer = document.getElementById('weather-temp-container');
            const descEl = document.getElementById('weather-desc');
            const iconEl = document.getElementById('weather-icon');

            tempContainer.innerHTML = `
                <span class="text-3xl font-bold text-slate-800">${data.high}°</span>
                <span class="text-xl text-slate-400 mx-1">/</span>
                <span class="text-2xl font-bold text-slate-600">${data.low}°</span>
            `;

            const w = getWeatherIcon(data.code);

            descEl.innerHTML = `${w.text} <span class="ml-2 text-blue-500 font-bold">${data.rain}%</span>`;
            iconEl.className = `fas ${w.icon} text-5xl block mt-3 transition-all duration-500 ${w.color} drop-shadow-sm`;
        }

        function getWeatherIcon(code) {
            if (code === 0) return { icon: 'fa-sun', color: 'text-orange-400', text: '晴朗' };
            if (code >= 1 && code <= 3) return { icon: 'fa-cloud-sun', color: 'text-yellow-400', text: '多雲時晴' };
            if (code === 45 || code === 48) return { icon: 'fa-smog', color: 'text-slate-400', text: '有霧' };
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { icon: 'fa-cloud-rain', color: 'text-blue-400', text: '有雨' };
            if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return { icon: 'fa-snowflake', color: 'text-blue-200', text: '下雪' };
            if (code >= 95) return { icon: 'fa-bolt', color: 'text-purple-500', text: '雷雨' };
            return { icon: 'fa-cloud', color: 'text-slate-400', text: '多雲' };
        }

    
        // ==========================================
        // 4. 讀取資料 (Read)
        // ==========================================
        async function loadSchedules() {
            try {
                // 建立查詢：只抓 day == 'day1' 的資料
                const q = query(collection(db, "schedules"), where("day", "==", CURRENT_DAY));
                const querySnapshot = await getDocs(q);
                
                scheduleData = [];
                querySnapshot.forEach((doc) => {
                    // 把 Firebase 的資料轉成我們需要的格式 (包含 ID)
                    scheduleData.push({ id: doc.id, ...doc.data() });
                });
    
                // 依照時間排序 (因為 Firestore 預設不保證順序)
                scheduleData.sort((a, b) => a.time.localeCompare(b.time));
                
                renderSchedules(); // 畫出畫面
            } catch (e) {
                console.error("讀取錯誤: ", e);
                alert("資料讀取失敗，請檢查 Console");
            }
        }
    
        // ==========================================
        // 5. 新增/修改資料 (Create / Update)
        // ==========================================
        // 注意：因為是 module，要掛載到 window 才能被 HTML onclick 呼叫
        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = '處理中...';
    
            const id = document.getElementById('input-id').value;
            
            // 準備要存入的資料物件
            const newItem = {
                day: CURRENT_DAY,
                time: document.getElementById('input-time').value,
                timeEnd: document.getElementById('input-time-end').value || '',
                type: document.getElementById('input-type').value,
                title: document.getElementById('input-title').value,
                location: document.getElementById('input-sub').value,
                link: document.getElementById('input-link').value || '',
                linkText: document.getElementById('input-link-text').value || '',
                note: ''
            };
    
            try {
                if (id) {
                    // --- 修改模式 (Update) ---
                    // 找到該 ID 的文件並更新
                    const scheduleRef = doc(db, "schedules", id);
                    await updateDoc(scheduleRef, newItem);
                } else {
                    // --- 新增模式 (Create) ---
                    // 新增到 'schedules' 集合
                    await addDoc(collection(db, "schedules"), newItem);
                }
                
                // 重新讀取並關閉視窗
                await loadSchedules();
                closeModal();
            } catch (e) {
                console.error("儲存錯誤: ", e);
                alert("儲存失敗");
            } finally {
                btn.disabled = false;
                btn.innerText = id ? '儲存變更' : '確認新增';
            }
        }
    
        // ==========================================
        // 6. 刪除資料 (Delete)
        // ==========================================
        window.deleteItem = async function(id) {
            if (!confirm('確定要刪除這個行程嗎？')) return;
    
            try {
                await deleteDoc(doc(db, "schedules", id));
                await loadSchedules(); // 重新整理畫面
            } catch (e) {
                console.error("刪除錯誤: ", e);
                alert("刪除失敗");
            }
        }
    
        // ==========================================
        // 7. 渲染畫面 (Render)
        // ==========================================
        function renderSchedules() {
        const container = document.getElementById('schedule-container');
        container.innerHTML = ''; // 清空內容

        scheduleData.forEach(item => {
            let icon = 'fa-map-marker-alt';
            if(item.type==='train'||item.type==='subway') icon='fa-train'; 
            if(item.type==='flight') icon='fa-plane'; 
            if(item.type==='food') icon='fa-utensils'; 
            if(item.type==='shop') icon='fa-shopping-bag'; 
            if(item.type==='car') icon='fa-car'; 
            if(item.type==='hotel') icon='fa-bed'; 
            if(item.type==='bus') icon='fa-bus';
            if(item.type==='ferry') icon='fa-ship';

            // 連結按鈕 (防止點擊連結時觸發展開，加入 event.stopPropagation)
            const linkBtn = item.link ? `<a href="${item.link}" target="_blank" onclick="event.stopPropagation()" class="mt-2 inline-block bg-slate-100 text-custom-green px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-100 transition"><i class="fas fa-external-link-alt mr-1"></i> ${item.linkText || '查看'}</a>` : '';

            let html = '';

            // --- 樣式 A: 航班卡片 (保留原本漸層，但加入展開功能) ---
            if (item.type === 'flight') {
                let fromCode = 'DEP', fromName = '', toCode = 'ARR', toName = '';
                if (item.location && item.location.includes('-')) {
                    const parts = item.location.split(/[-–—>]/);
                    if(parts.length >= 2) {
                        const fromPart = parts[0].trim().split(' '); fromCode = fromPart[0]||'DEP'; fromName = fromPart.slice(1).join(' ')||'';
                        const toPart = parts[1].trim().split(' '); toCode = toPart[0]||'ARR'; toName = toPart.slice(1).join(' ')||'';
                    }
                } else { fromCode = item.location || ''; }

                html = `
                <div onclick="toggleActions('sch-${item.id}', this)" class="mx-4 p-5 bg-gradient-custom rounded-3xl shadow-lg shadow-green-200 text-white relative transform transition-all duration-300 hover:scale-[1.01] cursor-pointer group">
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-white/20 px-2 py-0.5 rounded text-xs font-bold uppercase">FLIGHT</span>
                        <i class="fas fa-chevron-down chevron-icon text-white/70"></i>
                    </div>
                    <div class="flex justify-between items-center px-1 mb-4">
                        <div class="text-center flex flex-col items-center"><div class="text-2xl font-bold mb-1">${item.time}</div><div class="text-[10px] text-green-100 font-bold mb-0.5">FROM</div><div class="text-3xl font-bold tracking-wider">${fromCode}</div><div class="text-xs mt-0.5">${fromName}</div></div>
                        <div class="flex-1 mx-4 flex flex-col items-center pb-4"><i class="fas fa-plane text-2xl mb-1 transform --rotate-45 text-white/90"></i><div class="w-full border-t border-dashed border-white/40"></div></div>
                        <div class="text-center flex flex-col items-center"><div class="text-2xl font-bold mb-1">${item.timeEnd || '--:--'}</div><div class="text-[10px] text-green-100 font-bold mb-0.5">TO</div><div class="text-3xl font-bold tracking-wider">${toCode}</div><div class="text-xs mt-0.5">${toName}</div></div>
                    </div>
                    <div class="flex justify-between items-center border-t border-white/10 pt-3"><div class="text-sm font-medium">${item.title}</div><div class="bg-white/20 px-2 py-1 rounded text-[10px] font-bold">已確認</div></div>
                    
                    <div id="actions-sch-${item.id}" class="action-area flex gap-2">
                        <button onclick="event.stopPropagation(); editItem('${item.id}')" class="flex-1 bg-white/20 text-white py-2 rounded-lg text-sm font-bold hover:bg-white/30"><i class="fas fa-pen mr-1"></i> 編輯</button>
                        <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="flex-1 bg-white/20 text-white py-2 rounded-lg text-sm font-bold hover:bg-white/30"><i class="fas fa-trash mr-1"></i> 刪除</button>
                    </div>
                </div>`;
            } 
            // --- 樣式 B: 一般行程卡片 (主要修改這裡) ---
            else {
                let iconBg = 'bg-custom-green';
                if (item.type === 'food') iconBg = 'bg-orange-400';
                if (item.type === 'shop') iconBg = 'bg-pink-400';
                if (item.type === 'hotel') iconBg = 'bg-indigo-400';
                if (item.type === 'car') iconBg = 'bg-blue-500';

                html = `
                <div onclick="toggleActions('sch-${item.id}', this)" class="mx-4 bg-white rounded-3xl shadow-sm p-4 transform transition-all duration-300 hover:scale-[1.01] cursor-pointer border border-slate-100 relative group">
                    <div class="flex items-start justify-between">
                        <div class="flex flex-col items-center mr-4 pt-1">
                            <div class="w-12 h-12 ${iconBg} rounded-2xl flex items-center justify-center text-white text-xl mb-2 shadow-md">
                                <i class="fas ${icon}"></i>
                            </div>
                            <div class="text-sm font-bold text-slate-700">${item.time}</div>
                        </div>

                        <div class="flex-1 min-w-0 pr-2">
                            <h3 class="font-bold text-lg text-slate-800 break-words">${item.title}</h3>
                            <div class="flex items-center text-xs text-slate-500 mt-1 mb-1">
                                <span class="text-custom-green font-bold mr-2"><i class="fas fa-map-pin"></i></span>
                                <span class="truncate">${item.location || '無地點資訊'}</span>
                            </div>
                            ${item.note ? `<div class="text-xs text-slate-400 mb-1 line-clamp-2">${item.note}</div>` : ''}
                            ${linkBtn}
                        </div>

                        <div class="text-slate-300 px-1 flex-shrink-0 pt-1">
                            <i class="fas fa-chevron-down chevron-icon text-xs"></i>
                        </div>
                    </div>

                    <div id="actions-sch-${item.id}" class="action-area flex gap-2">
                        <button onclick="event.stopPropagation(); editItem('${item.id}')" class="flex-1 bg-green-50 text-custom-green py-2 rounded-lg text-sm font-bold hover:bg-green-100"><i class="fas fa-pen mr-1"></i> 編輯</button>
                        <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="flex-1 bg-red-50 text-red-500 py-2 rounded-lg text-sm font-bold hover:bg-red-100"><i class="fas fa-trash mr-1"></i> 刪除</button>
                    </div>
                </div>`;
            }
            container.innerHTML += html;
        });
		}
    
        // ==========================================
        // 8. 介面操作 (Modal, Edit, Toggle)
        // ==========================================
        // 這裡也要掛載到 window
        window.openModal = function() { 
            document.getElementById('add-form').reset(); 
            document.getElementById('input-id').value=''; 
            document.getElementById('modal-title').innerText='新增行程'; 
            document.getElementById('submit-btn').innerText='確認新增'; 
            toggleFlightInputs(); 
            document.getElementById('add-modal').classList.remove('hidden'); 
        }
        
        window.closeModal = function() { document.getElementById('add-modal').classList.add('hidden'); }
        
        // 綁定背景點擊關閉
		// 優化：防止選取文字拖曳到外部時誤關視窗
        const modal = document.getElementById('add-modal');
        let isMouseDownOnBackdrop = false;

        // 1. 監聽滑鼠按下：確認是否按在背景上
        modal.addEventListener('mousedown', function(e) {
            isMouseDownOnBackdrop = (e.target === this);
        });

        // 2. 監聽點擊：只有當「按下」與「放開」都在背景時才關閉
        modal.addEventListener('click', function(e) {
            if (e.target === this && isMouseDownOnBackdrop) {
                closeModal();
            }
        });
    
        // 編輯 (將資料填回表單)
        window.editItem = function(id) {
            const item = scheduleData.find(x => x.id === id);
            if(item){
                document.getElementById('input-id').value = item.id;
                document.getElementById('input-type').value = item.type;
                
                // 觸發一下 toggle 以顯示/隱藏航班欄位
                toggleFlightInputs();
    
                document.getElementById('input-time').value = item.time;
                if(item.type === 'flight') {
                    document.getElementById('input-time-end').value = item.timeEnd || '';
                }
                document.getElementById('input-title').value = item.title;
                document.getElementById('input-sub').value = item.location;
                document.getElementById('input-link').value = item.link || '';
                document.getElementById('input-link-text').value = item.linkText || '';
                
                document.getElementById('modal-title').innerText = '編輯行程';
                document.getElementById('submit-btn').innerText = '儲存變更';
                document.getElementById('add-modal').classList.remove('hidden');
            }
        }
    
        // 航班輸入框切換
        window.toggleFlightInputs = function() {
            const type = document.getElementById('input-type').value;
            const arrivalBlock = document.getElementById('arrival-time-block');
            const startLabel = document.getElementById('label-time-start');
            const hint = document.getElementById('flight-hint');
            if (type === 'flight') {
                arrivalBlock.classList.remove('hidden');
                startLabel.innerText = '出發時間';
                hint.classList.remove('hidden');
            } else {
                arrivalBlock.classList.add('hidden');
                startLabel.innerText = '時間';
                hint.classList.add('hidden');
            }
        }
    
        // 修改 1: 改用 DOMContentLoaded，讓它一讀完 HTML 就執行，不用等圖片
        document.addEventListener('DOMContentLoaded', function() {
            const activeTab = document.getElementById('active-tab');
            const container = document.getElementById('date-nav');
            
            if (activeTab && container) {
                // 計算位置：保留左邊約 80px 的空間
                const targetScroll = activeTab.offsetLeft - 80;
                
                // 修改 2: 將 behavior 改為 'auto' (瞬間跳轉)，這樣使用者就不會看到滑動的過程
                container.scrollTo({
                    left: targetScroll,
                    behavior: 'auto' 
                });
            }
        });

        // 其他載入函式維持在 load 事件 (避免影響定位)
        window.addEventListener('load', function() {
            if (typeof loadAllData === 'function') loadAllData();     // Index 用的
            if (typeof renderWeatherWidget === 'function') renderWeatherWidget(); // Index 用的
            if (typeof loadSchedules === 'function') loadSchedules(); // Day 分頁用的
            if (typeof fetchWeather === 'function') fetchWeather();   // Day 分頁用的
        });
    		
		window.toggleActions = function(id, element) {
			// 找到對應的隱藏區塊
			const actionArea = document.getElementById(`actions-${id}`);
			// 找到該列裡面的箭頭圖示
			const icon = element.querySelector('.chevron-icon');
			
			// 切換展開樣式
			if (actionArea && icon) {
				actionArea.classList.toggle('open');
				icon.classList.toggle('rotate');
			}
		}		
	
    </script>
</body>
</html>
