<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* 您的品牌深綠色 */
        .text-custom-green { color: rgb(0, 140, 0); }
        .bg-custom-green { background-color: rgb(0, 140, 0); }
        .border-custom-green { border-color: rgb(0, 140, 0); }

        /* Modal 動畫 */
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 圖片放大動畫 */
        .animate-zoom-in { animation: zoomIn 0.2s ease-out forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* 區塊收合動畫 */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: slideDown 0.3s ease-in-out; }
        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
        
        /* 按鈕區塊展開動畫 */
        .action-area { 
            max-height: 0; overflow: hidden; 
            transition: max-height 0.3s ease-out, opacity 0.3s, margin 0.3s;
            opacity: 0;
        }
        .action-area.open {
            max-height: 100px; opacity: 1; margin-top: 12px;
        }

        /* 箭頭旋轉 */
        .chevron-icon { transition: transform 0.3s; }
        .chevron-icon.rotate { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-green-50 text-slate-800 pb-24 min-h-screen">

    <div class="p-6 pt-10 flex justify-start items-center sticky top-0 z-20">
        <h1 class="text-2xl font-bold text-slate-800 flex items-center">
            購物清單 <i class="fas fa-shopping-bag text-custom-green ml-2"></i>
        </h1>
    </div>

    <div class="flex p-2 gap-2 sticky top-[72px] z-20 bg-green-50/95 backdrop-blur-sm">
        <button onclick="switchCity('fuk')" id="tab-fuk" class="flex-1 py-2 rounded-xl font-bold text-base shadow-md transition-all duration-300 flex items-center justify-center gap-2 transform active:scale-95">
            <span class="w-1.5 h-1.5 rounded-full bg-white"></span> 福岡 Fukuoka
        </button>
        <button onclick="switchCity('pus')" id="tab-pus" class="flex-1 py-2 rounded-xl font-bold text-base shadow-md transition-all duration-300 flex items-center justify-center gap-2 transform active:scale-95">
            <span class="w-1.5 h-1.5 rounded-full bg-white"></span> 釜山 Busan
        </button>
    </div>

    <div id="content-area" class="px-4 space-y-4 animate-fade-in"></div>

    <div id="shopping-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-[90%] max-w-sm rounded-3xl p-6 shadow-2xl modal-enter max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-xl font-bold text-slate-800">新增商品</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="shopping-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="input-id"> <input type="hidden" id="input-city"> <input type="hidden" id="input-category">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">商品圖片 (選填)</label>
                        <input type="file" id="input-image" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-custom-green hover:file:bg-green-100">
                        <div id="img-preview-container" class="mt-2 hidden relative w-fit">
                            <img id="img-preview" src="" class="h-24 w-auto rounded-lg border border-slate-200 object-cover">
                            <button type="button" onclick="clearImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-sm"><i class="fas fa-times"></i></button>
                        </div>
                        <input type="hidden" id="base64-storage">
                    </div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">商品名稱</label><input type="text" id="input-name" required class="w-full bg-slate-100 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-custom-green"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">商品連結 (選填)</label><input type="url" id="input-url" placeholder="https://..." class="w-full bg-slate-100 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-custom-green text-sm"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">備註 / 價格 (選填)</label><input type="text" id="input-note" placeholder="例如: ¥1000, 買兩個..." class="w-full bg-slate-100 rounded-xl px-4 py-3 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-custom-green"></div>
                </div>
                <button type="submit" id="submit-btn" class="w-full text-white font-bold py-3 rounded-xl mt-6 shadow-lg active:scale-95 transition-transform">確認儲存</button>
            </form>
        </div>
    </div>

    <div id="image-zoom-modal" class="fixed inset-0 z-[150] bg-black/90 hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeImageModal()">
        <img id="zoomed-image" src="" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain scale-90 animate-zoom-in">
        <button onclick="closeImageModal()" class="absolute top-4 right-4 text-white text-xl bg-black/30 w-8 h-8 rounded-full flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>

    <div class="fixed bottom-6 left-4 right-4 bg-white rounded-full shadow-2xl py-3 px-6 flex justify-between items-center z-40">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-custom-green cursor-pointer w-1/3"><i class="fas fa-suitcase text-lg mb-1"></i><span class="text-[10px]">行程</span></a>
        <a href="accounting.html" class="flex flex-col items-center text-slate-400 hover:text-custom-green cursor-pointer w-1/3"><i class="fas fa-wallet text-lg mb-1"></i><span class="text-[10px]">記帳</span></a>
        <div class="flex flex-col items-center text-custom-green cursor-pointer w-1/3"><i class="fas fa-shopping-bag text-lg mb-1"></i><span class="text-[10px] font-bold">購物</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyA866R1dunG70pNX91BhvIVortnlB5QuHU",
            authDomain: "fukuoka-busan-trip.firebaseapp.com",
            projectId: "fukuoka-busan-trip",
            storageBucket: "fukuoka-busan-trip.firebasestorage.app",
            messagingSenderId: "130540342304",
            appId: "1:130540342304:web:f4a3f225ab3f2b37f00045",
            measurementId: "G-XDV9S0066R"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let shoppingData = [];
        let currentCity = 'fuk'; 

        const CATEGORIES = [
            { id: 'cosmetic', name: '藥妝 Cosmetics', icon: 'fa-pump-soap' },
            { id: 'food', name: '食品 Food', icon: 'fa-utensils' },
            { id: 'daily', name: '日用品 Daily', icon: 'fa-toilet-paper' }
        ];

        async function loadShoppingItems() {
            try {
                const q = query(collection(db, "shopping_items"), orderBy("created_at", "desc"));
                const snapshot = await getDocs(q);
                shoppingData = [];
                snapshot.forEach(doc => shoppingData.push({ id: doc.id, ...doc.data() }));
                renderContent();
            } catch(e) { console.error(e); }
        }

        window.switchCity = function(city) {
            currentCity = city;
            renderContent();
        }

        function renderContent() {
            const tabFuk = document.getElementById('tab-fuk');
            const tabPus = document.getElementById('tab-pus');
            
            // 頁籤樣式
            if (currentCity === 'fuk') {
                tabFuk.className = "flex-1 py-2 rounded-xl font-bold text-base shadow-lg transition-all duration-300 flex items-center justify-center gap-2 bg-red-500 text-white transform scale-100";
                tabPus.className = "flex-1 py-2 rounded-xl font-bold text-base shadow-sm transition-all duration-300 flex items-center justify-center gap-2 bg-white text-slate-400";
            } else {
                tabFuk.className = "flex-1 py-2 rounded-xl font-bold text-base shadow-sm transition-all duration-300 flex items-center justify-center gap-2 bg-white text-slate-400";
                tabPus.className = "flex-1 py-2 rounded-xl font-bold text-base shadow-lg transition-all duration-300 flex items-center justify-center gap-2 bg-blue-500 text-white transform scale-100";
            }

            const themeColor = currentCity === 'fuk' ? 'red' : 'blue';
            const themeBg = currentCity === 'fuk' ? 'bg-red-50' : 'bg-blue-50';
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            CATEGORIES.forEach(cat => {
                const items = shoppingData.filter(i => i.city === currentCity && i.category === cat.id);
                
                const itemsHtml = items.map(item => `
                    <div onclick="toggleActions('shop-${item.id}', this)" class="p-3 bg-white rounded-xl border border-slate-100 shadow-sm mb-2 transition-all cursor-pointer ${item.bought ? 'opacity-60 bg-slate-50' : ''}">
                        <div class="flex items-center justify-between">
                            
                            <div onclick="event.stopPropagation(); toggleBought('${item.id}')" class="mr-3 cursor-pointer flex-shrink-0 py-2">
                                 <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${item.bought ? 'bg-custom-green border-custom-green' : 'bg-white border-slate-300'}">
                                    ${item.bought ? '<i class="fas fa-check text-white text-xs"></i>' : ''}
                                 </div>
                            </div>

                            <div class="flex-1 flex items-center min-w-0 pr-2">
                                ${item.image ? 
                                    // 圖片：stopPropagation 防止觸發展開
                                    `<img src="${item.image}" onclick="event.stopPropagation(); openImageModal(this.src)" class="w-12 h-12 rounded-lg object-cover border border-slate-200 mr-3 cursor-zoom-in bg-slate-100 flex-shrink-0 ${item.bought ? 'grayscale' : ''}">` : 
                                    `<div class="w-12 h-12 rounded-lg bg-slate-100 border border-slate-200 mr-3 flex items-center justify-center text-slate-300 flex-shrink-0"><i class="fas fa-image"></i></div>`
                                }
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-slate-700 truncate ${item.bought ? 'line-through text-slate-400' : ''}">${item.name}</h4>
                                    ${item.note ? `<p class="text-xs text-slate-400 truncate">${item.note}</p>` : ''}
                                </div>
                            </div>

                            <div class="flex items-center gap-2">
                                ${item.url ? `<a href="${item.url}" target="_blank" onclick="event.stopPropagation()" class="w-7 h-7 rounded-full bg-blue-50 text-blue-500 hover:bg-blue-100 transition flex items-center justify-center"><i class="fas fa-link text-xs"></i></a>` : ''}
                                <div class="text-slate-300 px-2 flex-shrink-0">
                                    <i class="fas fa-chevron-down chevron-icon text-xs"></i>
                                </div>
                            </div>
                        </div>

                        <div id="actions-shop-${item.id}" class="action-area flex gap-2">
                             <button onclick="event.stopPropagation(); openModal('${cat.id}', '${item.id}')" class="flex-1 bg-green-100 text-custom-green py-2 rounded-lg text-sm font-bold hover:bg-green-200"><i class="fas fa-pen mr-1"></i> 編輯</button>
                             <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="flex-1 bg-green-100 text-custom-green py-2 rounded-lg text-sm font-bold hover:bg-green-200"><i class="fas fa-trash mr-1"></i> 刪除</button>
                        </div>
                    </div>
                `).join('');

                const emptyHtml = `<div class="text-center py-6 text-slate-300 text-sm italic">尚無商品</div>`;
                const sectionHtml = `
                    <details class="bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden group/details" open>
                        <summary class="${themeBg} px-5 py-4 border-b border-slate-100 flex justify-between items-center cursor-pointer hover:bg-opacity-80 transition select-none">
                            <div class="flex items-center gap-2">
                                <i class="fas ${cat.icon} text-${themeColor}-500 text-lg w-6 text-center"></i>
                                <span class="font-bold text-slate-700 text-base">${cat.name}</span>
                                <span class="bg-${themeColor}-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${items.length}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="event.preventDefault(); openModal('${cat.id}')" class="w-7 h-7 bg-white text-${themeColor}-500 rounded-full shadow-sm flex items-center justify-center hover:scale-110 transition active:scale-95"><i class="fas fa-plus"></i></button>
                                <i class="fas fa-chevron-down text-slate-300 transition-transform group-open/details:rotate-180"></i>
                            </div>
                        </summary>
                        <div class="p-3 bg-slate-50/50">${items.length > 0 ? itemsHtml : emptyHtml}</div>
                    </details>`;
                container.innerHTML += sectionHtml;
            });
        }

        // 修改後的展開邏輯：從整行元素中尋找箭頭圖示
        window.toggleActions = function(id, rowElem) {
            const area = document.getElementById(`actions-${id}`);
            const icon = rowElem.querySelector('.chevron-icon');
            area.classList.toggle('open');
            icon.classList.toggle('rotate');
        }

        window.toggleBought = async function(id) {
            const item = shoppingData.find(i => i.id === id);
            if (!item) return;
            item.bought = !item.bought;
            renderContent();
            try { await updateDoc(doc(db, "shopping_items", id), { bought: item.bought }); } catch (err) { console.error(err); }
        }

        window.openModal = function(category, id = null) {
            document.getElementById('shopping-form').reset();
            clearImage();
            document.getElementById('shopping-modal').classList.remove('hidden');
            document.getElementById('input-city').value = currentCity;
            document.getElementById('input-category').value = category;
            document.getElementById('input-id').value = id || '';

            const themeColor = currentCity === 'fuk' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-500 hover:bg-blue-600';
            const btn = document.getElementById('submit-btn');
            btn.className = `w-full text-white font-bold py-3 rounded-xl mt-6 shadow-lg active:scale-95 transition-transform ${themeColor}`;

            if(id) {
                const item = shoppingData.find(i => i.id === id);
                document.getElementById('modal-title').innerText = '編輯商品';
                document.getElementById('input-name').value = item.name;
                document.getElementById('input-note').value = item.note || '';
                document.getElementById('input-url').value = item.url || '';
                if(item.image) {
                    document.getElementById('base64-storage').value = item.image;
                    document.getElementById('img-preview').src = item.image;
                    document.getElementById('img-preview-container').classList.remove('hidden');
                }
            } else { document.getElementById('modal-title').innerText = '新增商品'; }
        }

        const modal = document.getElementById('shopping-modal');
        let isMouseDownOnBackdrop = false;
        modal.addEventListener('mousedown', function(e) { isMouseDownOnBackdrop = (e.target === this); });
        modal.addEventListener('click', function(e) { if (e.target === this && isMouseDownOnBackdrop) { closeModal(); } });
        window.closeModal = function() { document.getElementById('shopping-modal').classList.add('hidden'); }

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('input-id').value;
            const payload = {
                city: document.getElementById('input-city').value,
                category: document.getElementById('input-category').value,
                name: document.getElementById('input-name').value,
                note: document.getElementById('input-note').value,
                url: document.getElementById('input-url').value,
                image: document.getElementById('base64-storage').value || null,
                created_at: Date.now()
            };
            try {
                if (id) { delete payload.created_at; await updateDoc(doc(db, "shopping_items", id), payload); } 
                else { payload.bought = false; await addDoc(collection(db, "shopping_items"), payload); }
                loadShoppingItems();
                closeModal();
            } catch (err) { alert("儲存失敗"); console.error(err); }
        }

        window.deleteItem = async function(id) {
            if(!confirm('確定刪除這個商品嗎？')) return;
            await deleteDoc(doc(db, "shopping_items", id));
            loadShoppingItems();
        }

        const fileInput = document.getElementById('input-image');
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const SAFETY_LIMIT_BYTES = 700 * 1024; 
            if (file.size < SAFETY_LIMIT_BYTES) {
                const reader = new FileReader();
                reader.onload = (ev) => showPreview(ev.target.result);
                reader.readAsDataURL(file);
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1920; 
                    let width = img.width; let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; } 
                        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    let quality = 0.85;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);
                    while (dataUrl.length > 1000000 && quality > 0.3) {
                        quality -= 0.1; dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }
                    showPreview(dataUrl);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function showPreview(src) {
            document.getElementById('img-preview').src = src;
            document.getElementById('base64-storage').value = src;
            document.getElementById('img-preview-container').classList.remove('hidden');
        }
        window.clearImage = function() {
            document.getElementById('input-image').value = '';
            document.getElementById('base64-storage').value = '';
            document.getElementById('img-preview-container').classList.add('hidden');
            document.getElementById('img-preview').src = '';
        }
        window.openImageModal = function(src) {
            document.getElementById('zoomed-image').src = src;
            document.getElementById('image-zoom-modal').classList.remove('hidden');
        }
        window.closeImageModal = function() { document.getElementById('image-zoom-modal').classList.add('hidden'); }
        window.addEventListener('load', loadShoppingItems);
    </script>
</body>
</html>
